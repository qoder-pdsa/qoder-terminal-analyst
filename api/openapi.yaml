openapi: 3.1.0
info:
  title: Qoder Terminal Analyst API
  version: 0.1.0
servers:
  - url: http://localhost:8082
paths:
  /health:
    get:
      operationId: getHealth
      summary: Get health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/ask:
    post:
      operationId: ask
      summary: Ask
      description: |
        自然语言分析请求。以 SSE 流式返回 `AgentEvent`
        （见 api/agent-event.schema.json）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        context:
          type: object
          properties:
            activeSymbol: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
